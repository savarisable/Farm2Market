services:
  - type: web
    name: farm2market-ai
    env: node
    plan: free
    buildCommand: npm --prefix backend install && npm --prefix frontend install && cp backend/prisma/schema.postgresql.prisma backend/prisma/schema.prisma && npx --prefix backend prisma generate && npm run build
    startCommand: npx --prefix backend prisma db push --accept-data-loss && npx --prefix backend tsx prisma/seed.ts && cd backend && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farm2market-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SERP_API_KEY
        sync: false

databases:
  - name: farm2market-db
    plan: free
    databaseName: farm2market_db
    user: farm2market
