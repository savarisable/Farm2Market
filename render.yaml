services:
  - type: web
    name: farm2market-ai
    env: node
    plan: free
    buildCommand: cd backend && npm install && cp prisma/schema.postgresql.prisma prisma/schema.prisma && npx prisma generate && npm run build && cd ../frontend && npm install && npm run build && cd ..
    startCommand: cd backend && npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farm2market-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SERP_API_KEY
        sync: false

databases:
  - name: farm2market-db
    plan: free
    databaseName: farm2market_db
    user: farm2market
